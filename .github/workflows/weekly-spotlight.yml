name: Update weekly UCL spotlight

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spotlight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build weekly match spotlight
        env:
          FIREBASE_DB_URL: https://world-cup-2026-predictio-7c7b2-default-rtdb.firebaseio.com
          FOOTBALL_DATA_TOKEN: ${{ secrets.TK2 }}
        run: node scripts/weekly-spotlight-v7.mjs
