name: Apply old-money palette

on:
  push:
    paths:
      - 'assets/.apply-oldmoney'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Load old-money palette last
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          link='<link rel="stylesheet" href="assets/ucl-oldmoney.css?v=4">'
          if link not in s:
              s=s.replace('</head>',link+'\n</head>',1)
          s=s.replace('<meta name="theme-color" content="#05070a">','<meta name="theme-color" content="#0F172A">')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply 70-20-10 old-money palette' || exit 0
          git push
