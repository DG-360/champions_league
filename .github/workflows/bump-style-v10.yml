name: Bump UCL style cache

on:
  push:
    paths:
      - 'assets/.bump-style-v10'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cache version
        run: |
          sed -i 's/ucl-contrast-v9.css?v=1/ucl-contrast-v9.css?v=10/g' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump UCL final polish cache' || exit 0
          git push
