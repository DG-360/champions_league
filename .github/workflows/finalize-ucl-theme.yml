name: Finalize UCL theme

on:
  push:
    paths:
      - 'assets/ucl-theme.css'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Keep one visual stylesheet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<link rel="stylesheet" href="assets/ucl-theme.css?v=2">','<link rel="stylesheet" href="assets/ucl-theme.css?v=5">')
          s=s.replace('\n<link rel="stylesheet" href="assets/ucl-luxury.css?v=3">','')
          s=s.replace('\n<link rel="stylesheet" href="assets/ucl-oldmoney.css?v=4">','')
          s=s.replace('<meta name="theme-color" content="#0F172A">','<meta name="theme-color" content="#0F172A">')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f assets/ucl-luxury.css assets/ucl-oldmoney.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/ucl-luxury.css assets/ucl-oldmoney.css
          git commit -m 'Consolidate Champions League visual system' || exit 0
          git push
