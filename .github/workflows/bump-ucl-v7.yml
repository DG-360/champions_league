name: Bump UCL v7

on:
  push:
    paths:
      - 'assets/ucl-theme.css'
      - '.github/workflows/bump-ucl-v7.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bump stylesheet cache and theme color
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('assets/ucl-theme.css?v=6','assets/ucl-theme.css?v=7')
          s=s.replace('<meta name="theme-color" content="#0F172A">','<meta name="theme-color" content="#0B164B">')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump UCL stadium palette to v7' || exit 0
          git push
