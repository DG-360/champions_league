name: Update Champions League Betable model

on:
  # Wake once per day. The model performs a cheap Firebase preflight first and
  # exits without API/news work unless the next matchweek is about one day away.
  schedule:
    - cron: '45 14 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force recalculation now'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: champions-league-betable-model
  cancel-in-progress: false

jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install model dependencies
        run: python -m pip install --upgrade numpy scikit-learn
      - name: Calculate weekly hybrid probabilities
        env:
          FIREBASE_DB_URL: https://world-cup-2026-predictio-7c7b2-default-rtdb.firebaseio.com
          FOOTBALL_DATA_TOKEN: ${{ secrets.TK2 }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python scripts/bettable_model_v2.py --repo-root . --publish --force
          else
            python scripts/bettable_model_v2.py --repo-root . --publish
          fi
      - name: Upload cached historical data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucl-betable-cache
          path: model_cache/
          if-no-files-found: warn
