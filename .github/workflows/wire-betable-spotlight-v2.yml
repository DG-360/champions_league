name: Wire Betable and Spotlight v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load v2 recommendation and spotlight layers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'assets/ucl-spotlight-v2.css?v=1' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="assets/ucl-spotlight-v2.css?v=1">\n</head>')
          if 'assets/ucl-betable-v2.js?v=1' not in s:
              s=s.replace('</body>','<script src="assets/ucl-betable-v2.js?v=1"></script>\n<script src="assets/ucl-spotlight-v2.js?v=1"></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Load Betable and Spotlight v2 UI'
          git push
