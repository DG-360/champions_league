name: Publish Champions League site

on:
  push:
    paths:
      - '_payload/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify package pieces
        shell: bash
        run: |
          for f in 00 01 02 03 05 06 07 08; do test -s "_payload/${f}.part"; done
          test -s _payload/04a1.part
          test -s _payload/04a2.part
          test -s _payload/04b.part
      - name: Reconstruct application
        shell: bash
        run: |
          cat _payload/00.part _payload/01.part _payload/02.part _payload/03.part _payload/04a1.part _payload/04a2.part _payload/04b.part _payload/05.part _payload/06.part _payload/07.part _payload/08.part | base64 -d > /tmp/ucl_payload.tar.gz
          tar -xzf /tmp/ucl_payload.tar.gz
          test -s index.html
          test -s scripts/fetch-results.mjs
          test -s scripts/bettable_model.py
      - name: Normalize API token input
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/fetch-results.mjs')
          s = p.read_text()
          old = 'const token = (process.env.FOOTBALL_DATA_TOKEN || "").trim();'
          new = '''const rawToken = process.env.FOOTBALL_DATA_TOKEN || "";
          const tokenMatches = rawToken.match(/[A-Za-z0-9_-]{20,}/g) || [];
          const token = (tokenMatches[tokenMatches.length - 1] || rawToken.replace(/\\s+/g, "")).trim();'''
          if old not in s:
              raise SystemExit('Token normalization target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate source
        shell: bash
        run: |
          node --check scripts/fetch-results.mjs
          python -m py_compile scripts/bettable_model.py
          grep -q 'const ROOT.*cl2627' index.html
          grep -q 'football-data.org' index.html
      - name: Test real Champions League sync
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.TK2 }}
          FIREBASE_DB_URL: https://world-cup-2026-predictio-7c7b2-default-rtdb.firebaseio.com
          DRY_RUN: 'true'
        run: node scripts/fetch-results.mjs
      - name: Commit published site
        shell: bash
        run: |
          rm -rf _payload .github/workflows/bootstrap.yml app-01.js style-01.css style-02.css style-03.css style-04.css style-05.css bet_pl_model.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Champions League predictor' || exit 0
          git push
