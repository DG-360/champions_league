name: Publish Champions League site

on:
  push:
    paths:
      - '_payload/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait until complete payload is present
        id: payload
        shell: bash
        run: |
          count=$(find _payload -maxdepth 1 -name '*.part' 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -ne 9 ]; then
            echo "Payload has $count/9 chunks; nothing to publish yet."
          fi
      - name: Reconstruct application
        if: steps.payload.outputs.count == '9'
        shell: bash
        run: |
          cat _payload/*.part | base64 -d > /tmp/ucl_payload.tar.gz
          tar -xzf /tmp/ucl_payload.tar.gz
          test -s index.html
          test -s scripts/fetch-results.mjs
          test -s scripts/bettable_model.py
      - name: Validate source
        if: steps.payload.outputs.count == '9'
        shell: bash
        run: |
          node --check scripts/fetch-results.mjs
          python -m py_compile scripts/bettable_model.py
          grep -q 'const ROOT.*cl2627' index.html
          grep -q 'football-data.org' index.html
      - name: Test real Champions League sync
        if: steps.payload.outputs.count == '9'
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.TK2 }}
          FIREBASE_DB_URL: https://world-cup-2026-predictio-7c7b2-default-rtdb.firebaseio.com
          DRY_RUN: 'true'
        run: node scripts/fetch-results.mjs
      - name: Commit published site
        if: steps.payload.outputs.count == '9'
        shell: bash
        run: |
          rm -rf _payload .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Champions League predictor' || exit 0
          git push
