name: Load UCL contrast v9

on:
  push:
    paths:
      - 'assets/ucl-contrast-v9.css'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Load final contrast layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="assets/ucl-contrast-v9.css?v=1">'
          if link not in s:
              s = s.replace('</head>', link + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load UCL contrast hierarchy' || exit 0
          git push
