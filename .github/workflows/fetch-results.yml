name: Sync Champions League fixtures and results

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run (look, do not write)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: champions-league-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply material-depth UI refinement v13
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('assets/ucl-contrast-v9.css')
          s = css.read_text(encoding='utf-8')
          marker = '/* UCL MATERIAL DEPTH v13 */'
          block = r'''

/* UCL MATERIAL DEPTH v13
   Implements blind-review recommendations:
   stronger material contrast, detectable smooth boundaries, consistent radius,
   visible physical depth, ~3% purple as a meaningful premium signal. */

:root{
  --m-canvas:#010719;
  --m-section:#071747;
  --m-card:#091D56;
  --m-card-deep:#08194B;
  --m-raised:#102A6A;
  --m-raised-hi:#14357D;
  --m-border-main:rgba(140,183,255,.25);
  --m-border-secondary:rgba(140,183,255,.15);
  --m-divider:rgba(180,200,240,.08);
  --m-purple:#B464F1;
  --m-cyan:#6ABDF4;
  --m-r-major:20px;
  --m-r-secondary:15px;
  --m-r-control:10px;
  --m-r-badge:7px;
}

/* 1) Stronger page -> card -> raised-control tonal ladder. */
html{background:var(--m-canvas)!important}
body{
  background:
    radial-gradient(60rem 26rem at 96% -7%,rgba(106,189,244,.055),transparent 64%),
    radial-gradient(46rem 22rem at 94% 12%,rgba(180,100,241,.030),transparent 67%),
    linear-gradient(180deg,#020A24 0%,var(--m-canvas) 48%,#000514 100%)!important;
}
body::after{opacity:.055!important}

/* 2) Detectable, smooth card boundaries: tone + edge + shadow + inset highlight. */
.panel,.ucl-card,.mc,.sheet{
  background:linear-gradient(145deg,var(--m-card),var(--m-card-deep))!important;
  border:1px solid var(--m-border-main)!important;
  box-shadow:
    0 18px 45px rgba(0,0,0,.32),
    0 2px 12px rgba(59,112,220,.08),
    0 12px 34px -30px rgba(180,100,241,.30),
    inset 0 1px 0 rgba(255,255,255,.035)!important;
}
.panel,.ucl-card{border-radius:var(--m-r-major)!important}
.mc{border-radius:18px!important}
.sheet{border-radius:20px!important}
.ubar{
  background:linear-gradient(145deg,#0A1C51,#06143E)!important;
  border:1px solid var(--m-border-secondary)!important;
  border-radius:18px!important;
  box-shadow:0 14px 36px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.025)!important;
}
.sb-card,.fz-post,.bt-card,.bt-model{
  border:1px solid var(--m-border-secondary)!important;
  border-radius:var(--m-r-secondary)!important;
}
.panel-h,.mc-top,.ucl-card-h{
  border-bottom:1px solid var(--m-divider)!important;
}

/* Consistent curvature system for controls / badges. */
.nav{border-radius:16px!important;border:1px solid var(--m-border-secondary)!important;box-shadow:0 10px 28px rgba(0,0,0,.18)!important}
.nav button,.pager button,.pager select,.ucl-cta,.sin,.fld input,.fld select,.bt-ctx-controls input,.bt-ctx-controls select{border-radius:var(--m-r-control)!important}
.tag,.bt-gate,.bt-model,.bonus-tag{border-radius:var(--m-r-badge)!important}

/* 3) Active nav: cyan first, purple reflected glow second. */
.nav button.on{
  background:linear-gradient(180deg,rgba(106,189,244,.17),rgba(106,189,244,.08))!important;
  border-color:rgba(106,189,244,.18)!important;
  box-shadow:
    inset 0 -2px var(--m-cyan),
    0 7px 15px -9px rgba(180,100,241,.88)!important;
}

/* 4) HOME — Next European Nights strongest, Campaign restored as a real shorter card. */
.ucl-dashboard-grid{
  align-items:start!important;
  gap:28px!important;
  margin-bottom:32px!important;
}
.ucl-dashboard-grid>.ucl-card:first-child{
  background:linear-gradient(145deg,#0A205E,#081A4C)!important;
  border:1px solid rgba(140,183,255,.30)!important;
  border-top:2px solid rgba(106,189,244,.80)!important;
  box-shadow:0 20px 48px rgba(0,0,0,.34),0 4px 15px rgba(69,126,225,.09),inset 0 1px 0 rgba(255,255,255,.04)!important;
}
.ucl-dashboard-grid>.ucl-card:nth-child(2){
  background:linear-gradient(145deg,var(--m-section),#051139)!important;
  border:1px solid var(--m-border-secondary)!important;
  border-top:2px solid rgba(180,100,241,.52)!important;
  border-radius:var(--m-r-major)!important;
  box-shadow:
    0 16px 40px rgba(0,0,0,.26),
    0 8px 26px -22px rgba(180,100,241,.68),
    inset 0 1px 0 rgba(255,255,255,.025)!important;
  align-self:start!important;
}
.ucl-dashboard-grid>.ucl-card:nth-child(2) .ucl-card-h{
  padding:14px 16px!important;
  border-bottom:1px solid var(--m-divider)!important;
}
.ucl-dashboard-grid>.ucl-card:nth-child(2) .ucl-stat-row{padding:15px 16px 17px!important}

/* Home actions: same cyan family, smaller, more horizontal breathing room. */
.ucl-cta-row{gap:32px!important;padding:16px 20px 18px!important}
.ucl-cta,.ucl-cta.primary,.ucl-cta:not(.primary){
  width:164px!important;
  min-width:164px!important;
  min-height:38px!important;
  background:linear-gradient(180deg,var(--m-raised),#0D235A)!important;
  border:1px solid rgba(106,189,244,.46)!important;
  color:#fff!important;
  box-shadow:
    0 10px 24px rgba(0,0,0,.20),
    0 7px 18px -15px rgba(106,189,244,.58),
    inset 0 1px 0 rgba(255,255,255,.04)!important;
}
.ucl-cta:hover,.ucl-cta.primary:hover,.ucl-cta:not(.primary):hover{
  background:linear-gradient(180deg,var(--m-raised-hi),#102A6A)!important;
  border-color:rgba(128,205,250,.70)!important;
}

/* 5) FIXTURES — make boxes and controls physically readable from the match card. */
.mc{border-color:rgba(140,183,255,.22)!important}
.mc:hover{
  border-color:rgba(106,189,244,.38)!important;
  box-shadow:0 22px 50px rgba(0,0,0,.36),0 10px 30px -24px rgba(180,100,241,.42),inset 0 1px 0 rgba(255,255,255,.035)!important;
}
.mid{
  background:linear-gradient(180deg,var(--m-raised),#0C245D)!important;
  border:1px solid rgba(106,189,244,.25)!important;
  border-radius:var(--m-r-secondary)!important;
  box-shadow:0 8px 22px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.035)!important;
}
.sin{
  background:linear-gradient(180deg,#133477,#0F2865)!important;
  border:1px solid rgba(106,189,244,.48)!important;
  box-shadow:0 7px 18px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.05)!important;
}
.sin:hover{background:linear-gradient(180deg,#183D88,#123071)!important;border-color:rgba(106,189,244,.72)!important}
.sin:focus,.sin.has{
  background:linear-gradient(180deg,#1A438E,#14357D)!important;
  border-color:var(--m-cyan)!important;
  box-shadow:0 0 0 3px rgba(106,189,244,.17),0 10px 24px rgba(0,0,0,.20),0 10px 25px -20px rgba(180,100,241,.62)!important;
}
.pager button.arw{
  background:linear-gradient(180deg,rgba(180,100,241,.13),rgba(180,100,241,.06))!important;
  border:1px solid rgba(180,100,241,.30)!important;
  box-shadow:0 7px 20px rgba(0,0,0,.16)!important;
}
.pager .now{
  background:linear-gradient(180deg,rgba(106,189,244,.26),rgba(106,189,244,.12))!important;
  border:1px solid rgba(106,189,244,.58)!important;
  box-shadow:0 7px 20px rgba(0,0,0,.16),0 7px 16px -13px rgba(180,100,241,.70)!important;
}
.pager select{background:linear-gradient(180deg,#10265E,#0B1B4D)!important;border:1px solid var(--m-border-main)!important}

/* 6) COMPETITION — restore section/card material while keeping qualification hierarchy restrained. */
#view>.panel:has(.ucl-table-wrap){
  background:linear-gradient(145deg,var(--m-card),var(--m-card-deep))!important;
  border:1px solid var(--m-border-main)!important;
  border-radius:var(--m-r-major)!important;
  box-shadow:0 18px 45px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.03)!important;
}
.ucl-row-out{opacity:1!important;background:rgba(180,100,241,.010)!important}
.ucl-row-out td,.ucl-row-out .pos,.ucl-row-out .tm-cell,.ucl-row-out .tm-cell span{opacity:1!important}
#view>.panel:has(.ucl-bracket){
  background:linear-gradient(145deg,var(--m-section),#05113A)!important;
  border:1px solid var(--m-border-secondary)!important;
  border-radius:18px!important;
  box-shadow:0 15px 38px rgba(0,0,0,.24),0 9px 26px -23px rgba(180,100,241,.42)!important;
  margin-top:32px!important;
  padding-top:0!important;
  overflow:hidden!important;
}
#view>.panel:has(.ucl-bracket)>.panel-h{padding:15px 16px!important;border-bottom:1px solid var(--m-divider)!important}
.ucl-bracket{padding:14px 16px 16px!important}
.ucl-tie{
  background:linear-gradient(145deg,#0B205D,#08194B)!important;
  border:1px solid var(--m-border-secondary)!important;
  border-radius:14px!important;
  box-shadow:0 8px 22px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.025)!important;
}

/* 7) BETABLE — clear section surfaces instead of one uninterrupted dark field. */
#view>.panel:has(.bt-hero){
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
}
.bt-hero{
  position:relative!important;
  background:linear-gradient(145deg,rgba(7,23,71,.72),rgba(5,16,52,.62))!important;
  border:1px solid var(--m-border-secondary)!important;
  border-left:3px solid var(--m-cyan)!important;
  border-radius:16px!important;
  padding:17px 18px!important;
  margin:8px 0 12px!important;
  box-shadow:0 12px 30px rgba(0,0,0,.18),0 8px 22px -20px rgba(180,100,241,.58)!important;
}
.bt-model{
  position:relative!important;
  display:inline-flex!important;
  align-items:center!important;
  gap:8px!important;
  margin:8px 0 22px!important;
  padding:8px 11px!important;
  background:linear-gradient(180deg,rgba(180,100,241,.11),rgba(180,100,241,.045))!important;
  border:1px solid rgba(180,100,241,.32)!important;
  border-radius:var(--m-r-badge)!important;
  box-shadow:0 8px 20px -15px rgba(180,100,241,.72)!important;
}
.bt-model::before{
  content:""!important;
  width:6px!important;height:6px!important;border-radius:50%!important;
  background:var(--m-purple)!important;
  box-shadow:0 0 10px rgba(180,100,241,.75)!important;
}
#view>.panel:has(.bt-hero)>.panel-h{
  margin-top:22px!important;
  padding:0 0 10px!important;
  border:0!important;
}
#view>.panel:has(.bt-hero)>.panel-h h3{display:flex!important;align-items:center!important;gap:9px!important}
#view>.panel:has(.bt-hero)>.panel-h h3::before{
  content:""!important;
  width:22px!important;height:2px!important;border-radius:2px!important;
  background:linear-gradient(90deg,var(--m-purple),rgba(180,100,241,.18))!important;
  box-shadow:0 0 10px rgba(180,100,241,.22)!important;
}
.bt-good,.bt-risk,.bt-combo,.bt-grid,.bt-list,
#view>.panel:has(.bt-hero)>.bt-empty{
  background:linear-gradient(145deg,var(--m-section),#05113A)!important;
  border:1px solid var(--m-border-secondary)!important;
  border-radius:var(--m-r-secondary)!important;
  box-shadow:0 14px 34px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.025)!important;
  margin-bottom:18px!important;
  overflow:hidden!important;
}
.bt-good{border-left:3px solid rgba(106,189,244,.75)!important;padding:12px 14px!important}
.bt-risk{
  border-left:3px solid rgba(180,100,241,.64)!important;
  padding:14px!important;
  box-shadow:0 14px 34px rgba(0,0,0,.20),0 8px 24px -22px rgba(180,100,241,.70),inset 0 1px 0 rgba(255,255,255,.025)!important;
}
#view>.panel:has(.bt-hero)>.bt-empty{padding:17px 18px!important;color:var(--u-meta)!important}
.bt-combo{padding:0 14px!important}
.bt-grid{padding:12px!important;gap:12px!important}
.bt-card{
  background:linear-gradient(145deg,var(--m-raised),#0D245B)!important;
  border:1px solid rgba(106,189,244,.22)!important;
  border-radius:14px!important;
  box-shadow:0 10px 25px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.035)!important;
}
.bt-card.hot{
  border-color:rgba(106,189,244,.45)!important;
  box-shadow:0 12px 28px rgba(0,0,0,.20),0 8px 22px -19px rgba(180,100,241,.70)!important;
}
.bt-list{padding:0 14px!important}
.bt-row{padding:13px 0!important;border-bottom:1px solid var(--m-divider)!important}
.bt-row:last-child{border-bottom:0!important}

/* 8) Purple rises to ~3% as 'special / intelligence / destination', never as large paint. */
#view>.panel:has(.tp){
  border-top:2px solid rgba(180,100,241,.58)!important;
  box-shadow:0 18px 45px rgba(0,0,0,.30),0 10px 28px -23px rgba(180,100,241,.64),inset 0 1px 0 rgba(255,255,255,.03)!important;
}
#view>.panel:has(.tp)>.panel-h h3::after{
  content:""!important;display:inline-block!important;width:24px!important;height:2px!important;margin-left:9px!important;
  background:linear-gradient(90deg,var(--m-purple),transparent)!important;border-radius:2px!important;
}

/* Stronger but restrained hover separation throughout. */
.panel:hover,.ucl-card:hover{border-color:rgba(140,183,255,.31)!important}

@media(max-width:700px){
  .ucl-dashboard-grid{gap:18px!important}
  .ucl-cta-row{gap:12px!important}
  .ucl-cta,.ucl-cta.primary,.ucl-cta:not(.primary){width:auto!important;min-width:0!important;flex:1 1 0!important}
  .bt-hero{padding:15px!important}
  .bt-good,.bt-risk,.bt-combo,.bt-grid,.bt-list,#view>.panel:has(.bt-hero)>.bt-empty{border-radius:13px!important}
}
'''
          if marker in s:
              s = s.split(marker,1)[0].rstrip() + '\n' + block
          else:
              s = s.rstrip() + block
          css.write_text(s,encoding='utf-8')

          idx = Path('index.html')
          html = idx.read_text(encoding='utf-8')
          html = html.replace('ucl-contrast-v9.css?v=12','ucl-contrast-v9.css?v=13')
          idx.write_text(html,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ucl-contrast-v9.css index.html
          git commit -m 'Apply UCL material-depth refinement v13' || true
          git push || true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync fixtures, teams and results
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.TK2 }}
          FIREBASE_DB_URL: https://world-cup-2026-predictio-7c7b2-default-rtdb.firebaseio.com
          DRY_RUN: ${{ inputs.dry || false }}
        run: node scripts/fetch-results.mjs
