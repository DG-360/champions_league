name: Sync Champions League fixtures and results

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run (look, do not write)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: champions-league-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Load shared Champions League hero layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/ucl-page-hero-v14.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
          if ! git diff --quiet -- index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Load shared Champions League hero v14'
            git push
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync fixtures, teams and results
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.TK2 }}
          FIREBASE_DB_URL: https://world-cup-2026-predictio-7c7b2-default-rtdb.firebaseio.com
          DRY_RUN: ${{ inputs.dry || false }}
        run: node scripts/fetch-results.mjs
