name: Bump UCL refinement cache

on:
  push:
    paths:
      - 'assets/.bump-refinement-v11'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update refinement cache version
        run: |
          sed -i 's/ucl-contrast-v9.css?v=10/ucl-contrast-v9.css?v=11/g' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump UCL refinement cache to v11' || exit 0
          git push
