name: Apply UCL experience layer

on:
  push:
    paths:
      - 'assets/ucl-experience.js'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Wire UCL assets into index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="assets/ucl-theme.css?v=1">'
          js = '<script src="assets/ucl-experience.js?v=1"></script>'
          if css not in s:
              s = s.replace('</head>', css + '\n</head>', 1)
          if js not in s:
              s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Wire Champions League experience assets' || exit 0
          git push
