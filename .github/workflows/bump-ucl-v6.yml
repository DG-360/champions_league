name: Bump UCL theme v6

on:
  push:
    paths:
      - 'assets/ucl-theme.css'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bump CSS cache version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('assets/ucl-theme.css?v=5','assets/ucl-theme.css?v=6')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump UCL theme cache to v6' || exit 0
          git push
