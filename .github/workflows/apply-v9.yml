name: Apply UCL v9 hierarchy

on:
  push:
    paths:
      - 'assets/.apply-v9'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply UI hierarchy fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('assets/ucl-theme.css')
          s = css.read_text(encoding='utf-8')
          marker = '/* UCL CONTRAST HIERARCHY v9 */'
          if marker not in s:
              s += r'''

/* UCL CONTRAST HIERARCHY v9 */
.ucl-cta-row{gap:10px!important;padding-top:13px!important}
.ucl-cta{min-height:42px!important;font-size:12px!important;font-weight:800!important;letter-spacing:.01em!important;border-width:1px!important;box-shadow:none!important}
.ucl-cta.primary{background:#6ABDF4!important;border-color:#8DD0F8!important;color:#050B2A!important}
.ucl-cta.primary:hover{background:#84CAF6!important;border-color:#A5DCF9!important}
.ucl-cta:not(.primary){background:#B464F1!important;border-color:#C988F5!important;color:#FFFFFF!important}
.ucl-cta:not(.primary):hover{background:#C076F3!important;border-color:#D49AF7!important}
.ucl-dashboard-grid>.ucl-card:first-child{border-top:3px solid #6ABDF4!important}
.ucl-dashboard-grid>.ucl-card:nth-child(2){border-top:3px solid #B464F1!important}
.ucl-dashboard-grid>.ucl-card:first-child .ucl-card-h{background:rgba(106,189,244,.085)!important}
.ucl-dashboard-grid>.ucl-card:nth-child(2) .ucl-card-h{background:rgba(180,100,241,.085)!important}
.ucl-dashboard-grid>.ucl-card:nth-child(2) .ucl-stat:nth-child(1) strong{color:#6ABDF4!important}
.ucl-dashboard-grid>.ucl-card:nth-child(2) .ucl-stat:nth-child(2) strong{color:#8FA9FF!important}
.ucl-dashboard-grid>.ucl-card:nth-child(2) .ucl-stat:nth-child(3) strong{color:#D49AF7!important}
.ucl-road{border-color:rgba(106,189,244,.18)!important;background:linear-gradient(150deg,#0E1B55,#0A1548 76%)!important}
.ucl-road-top h2{font-size:23px!important;color:#F6F8FF!important}
.ucl-road-top small{color:#AEBCE1!important}
.ucl-road-track::before{height:2px!important;top:15px!important;background:linear-gradient(90deg,#6ABDF4 0%,#3C73EE 45%,#B464F1 100%)!important;opacity:.48!important}
.ucl-stage{--stage:#3C73EE}.ucl-stage:nth-child(1){--stage:#6ABDF4}.ucl-stage:nth-child(2),.ucl-stage:nth-child(3){--stage:#3C73EE}.ucl-stage:nth-child(4),.ucl-stage:nth-child(5),.ucl-stage:nth-child(6){--stage:#B464F1}
.ucl-stage-dot{width:42px!important;height:30px!important;font-size:10px!important;color:var(--stage)!important;border-color:var(--stage)!important;background:#08123E!important;opacity:.72!important}
.ucl-stage-name{font-size:10.5px!important;color:#A8B5DA!important}.ucl-stage.done .ucl-stage-dot{background:#12235F!important;color:#C4D5FF!important;opacity:.9!important}.ucl-stage.done .ucl-stage-name{color:#C0CBE7!important}.ucl-stage.active .ucl-stage-dot{background:var(--stage)!important;border-color:var(--stage)!important;color:#FFFFFF!important;opacity:1!important;box-shadow:0 0 0 4px #0A1548,0 0 18px rgba(106,189,244,.15)!important}.ucl-stage.active .ucl-stage-name{color:#FFFFFF!important;font-weight:800!important}.ucl-stage.final.active .ucl-stage-dot{box-shadow:0 0 0 4px #0A1548,0 0 18px rgba(180,100,241,.18)!important}
.ucl-table thead th{background:#101E5C!important;color:#AEBCE1!important}
.ucl-zone-head td{font-size:11px!important;letter-spacing:.055em!important;padding-top:11px!important;padding-bottom:11px!important}
.ucl-zone-head.direct td{background:rgba(106,189,244,.14)!important;color:#8ED4FA!important;box-shadow:inset 4px 0 #6ABDF4!important}
.ucl-zone-head.playoff td{background:rgba(60,115,238,.15)!important;color:#9CB4FF!important;box-shadow:inset 4px 0 #3C73EE!important}
.ucl-zone-head.out td{background:rgba(180,100,241,.13)!important;color:#D6A0F7!important;box-shadow:inset 4px 0 #B464F1!important}
.ucl-row-direct{background:rgba(106,189,244,.022)!important;box-shadow:inset 3px 0 #6ABDF4!important}.ucl-row-playoff{background:rgba(60,115,238,.018)!important;box-shadow:inset 3px 0 #3C73EE!important}.ucl-row-out{background:rgba(180,100,241,.018)!important;box-shadow:inset 3px 0 #B464F1!important;opacity:.78!important}.ucl-row-direct .pos{color:#85D0F8!important}.ucl-row-playoff .pos{color:#8FA9FF!important}.ucl-row-out .pos{color:#CC91F4!important}
.ucl-key{gap:8px!important;padding:10px!important;background:#08123E!important}.ucl-key span{padding:10px 12px!important;border:1px solid rgba(151,178,255,.12)!important;border-radius:9px!important;background:#0B164B!important;color:#AAB7D9!important}.ucl-key span:nth-child(1){border-top:3px solid #6ABDF4!important;background:rgba(106,189,244,.055)!important}.ucl-key span:nth-child(2){border-top:3px solid #3C73EE!important;background:rgba(60,115,238,.055)!important}.ucl-key span:nth-child(3){border-top:3px solid #B464F1!important;background:rgba(180,100,241,.05)!important}.ucl-key span:nth-child(1) b{color:#8ED4FA!important}.ucl-key span:nth-child(2) b{color:#9CB4FF!important}.ucl-key span:nth-child(3) b{color:#D6A0F7!important}
.ucl-br-col:nth-child(1) .ucl-br-title b{color:#6ABDF4!important}.ucl-br-col:nth-child(2) .ucl-br-title b,.ucl-br-col:nth-child(3) .ucl-br-title b{color:#8FA9FF!important}.ucl-br-col:nth-child(4) .ucl-br-title b,.ucl-br-col:nth-child(5) .ucl-br-title b{color:#D49AF7!important}.ucl-br-col:nth-child(1) .ucl-tie{border-left:3px solid rgba(106,189,244,.65)!important}.ucl-br-col:nth-child(2) .ucl-tie,.ucl-br-col:nth-child(3) .ucl-tie{border-left:3px solid rgba(60,115,238,.65)!important}.ucl-br-col:nth-child(4) .ucl-tie,.ucl-br-col:nth-child(5) .ucl-tie{border-left:3px solid rgba(180,100,241,.62)!important}
@media(max-width:700px){.ucl-cta{font-size:11.5px!important;min-height:40px!important}.ucl-stage-name{font-size:10px!important}.ucl-key{grid-template-columns:1fr!important}}
'''
          css.write_text(s,encoding='utf-8')

          js = Path('assets/ucl-experience.js')
          j = js.read_text(encoding='utf-8')
          old = '    const oldHdr = app.querySelector(".hdr");\n    if(oldHdr) oldHdr.style.display = "none";'
          new = old + '\n    const footer = app.querySelector(".foot");\n    if(footer) footer.remove();'
          if 'const footer = app.querySelector(".foot")' not in j:
              j = j.replace(old,new)
          js.write_text(j,encoding='utf-8')

          idx = Path('index.html')
          html = idx.read_text(encoding='utf-8')
          html = html.replace('assets/ucl-theme.css?v=8','assets/ucl-theme.css?v=9')
          html = html.replace('assets/ucl-experience.js?v=1','assets/ucl-experience.js?v=2')
          idx.write_text(html,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ucl-theme.css assets/ucl-experience.js index.html
          git commit -m 'Improve UCL contrast and competition hierarchy' || exit 0
          git push
