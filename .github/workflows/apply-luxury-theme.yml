name: Apply luxury UCL theme

on:
  push:
    paths:
      - 'assets/ucl-luxury.css'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Load luxury theme last
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="assets/ucl-luxury.css?v=3">'
          if link not in s:
              s = s.replace('</head>', link + '\n</head>', 1)
          s = s.replace('<meta name="theme-color" content="#160f26">','<meta name="theme-color" content="#05070a">')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load quiet luxury Champions League theme' || exit 0
          git push
